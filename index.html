<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>codigo_funcionario.c</title>

<style>
body{
    margin:0;
    background:#000000; /* Fundo totalmente preto */
    font-family:Consolas, Monaco, monospace;
    padding:40px 0;
}

.editor{
    width:95%;
    max-width:1200px;
    margin:0 auto;
    background:#000000; /* Editor preto */
    padding:25px;
    border-radius:8px;
    box-shadow:0 0 30px rgba(0,255,0,0.2); /* leve brilho hacker */
    position:relative;
}

.editor button{
    position:absolute;
    top:15px;
    right:15px;
    background:#00ff88;
    color:#000;
    border:none;
    padding:8px 14px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#00ffaa;
}

pre{
    margin:0;
    font-size:15px;
    line-height:1.6;
    counter-reset: line;
    color:#ffffff; /* texto padrão branco */
}

.line{
    display:block;
    padding-left:60px;
    position:relative;
}

.line::before{
    counter-increment: line;
    content: counter(line);
    position:absolute;
    left:0;
    width:50px;
    text-align:right;
    color:#555555; /* número da linha cinza */
}

/* Cores estilo VS Code mais vibrantes */
.include{color:#00BFFF;}       /* azul vivo */
.type{color:#00FFAA;}          /* verde água */
.keyword{color:#FF00FF;}       /* roxo forte */
.string{color:#FFD700;}        /* amarelo */
.comment{color:#00FF00;}       /* verde hacker */
.function{color:#FF5555;}      /* vermelho suave */
.number{color:#FFA500;}        /* laranja */

.cursor{
    display:none;
}

    .terminal{
    width:95%;
    max-width:1200px;
    margin:40px auto;
    background:#111;
    padding:25px;
    border-radius:8px;
    color:#00FF00;
    font-family:Consolas, monospace;
}

#saida{
    margin-top:20px;
    white-space:pre-line;
}
    
</style>
</head>

<body>

<div class="editor">
<button onclick="copiarCodigo()">Copiar Código</button>
<pre id="codigo"></pre>
</div>

<div class="terminal">
<h3>Simulação do Programa</h3>

<label>Nome do funcionário:</label><br>
<input type="text" id="nome"><br><br>

<label>Cargo:</label><br>
<select id="cargo">
<option value="1">Auxiliar nos Carrinhos</option>
<option value="2">Operador de Caixa</option>
<option value="3">Auxiliar de Self</option>
<option value="4">Assistente de Frente de Caixa</option>
<option value="5">Fiscal</option>
</select><br><br>

<label>Período:</label><br>
<select id="periodo">
<option value="1">06:40 às 16:00</option>
<option value="2">08:00 às 16:20</option>
<option value="3">10:30 às 18:50</option>
<option value="4">13:00 às 21:20</option>
<option value="5">14:30 às 22:50</option>
</select><br><br>

<button onclick="executarPrograma()">Executar</button>

<div id="saida"></div>
</div>
    
<script>

    function executarPrograma(){

    const nome = document.getElementById("nome").value;
    const cargoSelect = document.getElementById("cargo");
    const periodoSelect = document.getElementById("periodo");

    const cargoTexto = cargoSelect.options[cargoSelect.selectedIndex].text;
    const periodoTexto = periodoSelect.options[periodoSelect.selectedIndex].text;

    const saida = `
--- INFORMAÇÕES DO FUNCIONÁRIO DA LOJA FORT ATACADISTA - JUNDIAÍ ---

Nome: ${nome}
Cargo: ${cargoTexto}
Horário: ${periodoTexto}
`;

    document.getElementById("saida").innerText = saida;
}

const codigoColorido = `
<span class="include">#include &lt;stdio.h&gt;</span>
<span class="include">#include &lt;string.h&gt;</span>

<span class="comment">// Função para mostrar o menu de cargos</span>
<span class="type">void</span> <span class="function">mostrarMenuCargo</span>() {
    printf(<span class="string">"\\nEscolha o cargo fornecido para o funcionário:\\n"</span>);
    printf(<span class="string">"1 - Auxiliar nos Carrinhos\\n"</span>);
    printf(<span class="string">"2 - Operador de Caixa\\n"</span>);
    printf(<span class="string">"3 - Auxiliar de Self\\n"</span>);
    printf(<span class="string">"4 - Assistente de Frente de Caixa\\n"</span>);
    printf(<span class="string">"5 - Fiscal\\n"</span>);
}

// Função para mostrar o menu de períodos
<span class="type">void</span> <span class="function">mostrarMenuPeriodo</span>() {
    printf(<span class="string">"\\nEscolha o período trabalhado deste funcionário:\\n"</span>);
    printf(<span class="string">"1 - 06:40 às 16:00\\n"</span>);
    printf(<span class="string">"2 - 08:00 às 16:20\\n"</span>);
    printf(<span class="string">"3 - 10:30 às 18:50\\n"</span>);
    printf(<span class="string">"4 - 13:00 às 21:20\\n"</span>);
    printf(<span class="string">"5 - 14:30 às 22:50\\n"</span>);
}

// Função para converter número do cargo em texto
<span class="type">void</span> <span class="function">obterCargo</span>(<span class="type">int</span> codigo, <span class="type">char</span> cargo[]) {
    <span class="keyword">switch</span> (codigo) {
        <span class="keyword">case</span> <span class="number">1</span>: strcpy(cargo, <span class="string">"Auxiliar nos Carrinhos"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">2</span>: strcpy(cargo, <span class="string">"Operador de Caixa"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">3</span>: strcpy(cargo, <span class="string">"Auxiliar de Self"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">4</span>: strcpy(cargo, <span class="string">"Assistente de Frente de Caixa"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">5</span>: strcpy(cargo, <span class="string">"Fiscal"</span>); <span class="keyword">break</span>;
        <span class="keyword">default</span>: strcpy(cargo, <span class="string">"Cargo inválido"</span>);
    }
}

// Função para mostrar o período formatado
<span class="type">void</span> <span class="function">mostrarPeriodo</span>(<span class="type">int</span> periodo) {
    <span class="keyword">switch</span> (periodo) {
        <span class="keyword">case</span> <span class="number">1</span>: printf(<span class="string">"Horário: 06:40 às 16:00\\n"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">2</span>: printf(<span class="string">"Horário: 08:00 às 16:20\\n"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">3</span>: printf(<span class="string">"Horário: 10:30 às 18:50\\n"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">4</span>: printf(<span class="string">"Horário: 13:00 às 21:20\\n"</span>); <span class="keyword">break</span>;
        <span class="keyword">case</span> <span class="number">5</span>: printf(<span class="string">"Horário: 14:30 às 22:50\\n"</span>); <span class="keyword">break</span>;
        <span class="keyword">default</span>: printf(<span class="string">"Período inválido!\\n"</span>);
    }
}

<span class="type">int</span> <span class="function">main</span>() {
    <span class="type">char</span> nome[<span class="number">50</span>], cargo[<span class="number">50</span>];
    <span class="type">int</span> codigoCargo, periodo;

    printf(<span class="string">"Digite o nome do funcionário: "</span>);
    scanf(<span class="string">"%49s"</span>, nome);

    mostrarMenuCargo();
    printf(<span class="string">"Digite o número correspondente: "</span>);
    scanf(<span class="string">"%d"</span>, &codigoCargo);
    obterCargo(codigoCargo, cargo);

    mostrarMenuPeriodo();
    printf(<span class="string">"Digite o número do período: "</span>);
    scanf(<span class="string">"%d"</span>, &periodo);

    printf(<span class="string">"\\n--- INFORMAÇÕES DO FUNCIONÁRIO DA LOJA FORT ATACADISTA - JUNDIAÍ ---\\n"</span>);
    printf(<span class="string">"Nome: %s\\n"</span>, nome);
    printf(<span class="string">"Cargo: %s\\n"</span>, cargo);
    mostrarPeriodo(periodo);

    <span class="keyword">return</span> <span class="number">0</span>;
}
`;

const elemento = document.getElementById("codigo");

function animar(texto){
    let i = 0;
    function escrever(){
        elemento.innerHTML = texto.substring(0,i) + '<span class="cursor"></span>';
        i++;
        if(i <= texto.length){
            setTimeout(escrever,1);
        } else {
            elemento.innerHTML = texto;
            numerar();
        }
    }
    escrever();
}

function numerar(){
    const linhas = elemento.innerHTML.split("\n");
    elemento.innerHTML = "";
    linhas.forEach(l=>{
        elemento.innerHTML += `<span class="line">${l}</span>`;
    });
}

function copiarCodigo(){
    navigator.clipboard.writeText(elemento.innerText);
    alert("Código copiado!");
}
    
elemento.innerHTML = codigoColorido;
numerar();
    
</script>

</body>
</html>
